  <title id="title">Rainlight Square and its central park</title>
  <desc id="description">An original static illustration of a fictional NYC-inspired miniature city. Four avenues and four cross streets frame a broad central park with lawns, a tree-lined pond, footbridge, limestone pergola, and winding walks. Protected bike lanes, brick buildings, roof tanks, subway stairs, a basketball court, buses and yellow cabs complete the neighborhood.</desc>
