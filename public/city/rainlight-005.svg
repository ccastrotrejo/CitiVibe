<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Rainlight Square: neighborhood and park</title>
  <desc id="description">Original static companion illustration of a fictional NYC-inspired miniature city, not a live view or a map of New York. Masonry homes, loft offices and ground-floor shops line the avenues, with a hospital, fire station and police station and staff outside. A car-free park retains its reservoir running loop, lawns, woodland, lake and pale bridge, fountain terrace and tree-lined mall. Two-way protected cycling tracks follow the park edges. Neighbors fill the sidewalks and play on full-size basketball and pickleball courts south of the park.</desc>
  <metadata>Original LivingCity vectors, revised 2026-09-16. Asset rainlight-005. No imported photographs, models, maps or fonts. Simplified companion illustration, not an exact renderer export. Retains the original park and street graph.</metadata>
