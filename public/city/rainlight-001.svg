<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Rainlight Square in the afternoon</title>
  <desc id="description">An original miniature garden district on a sand-colored base. A copper-roofed pavilion stands in the center-left plaza, with terracotta terrace steps to the right and a reed garden below-left. Cream and teal houses frame the square. An orange bus, three small cars, and walkers share the district. This is a static illustration.</desc>
