  <title id="title">Rainlight Square and its park</title>
  <desc id="description">Original static illustration of a fictional NYC-inspired miniature city, not a map of New York. Six avenues and six cross streets frame twenty-four blocks and a car-free park with a reservoir running loop, lawns, woodland, lake and pale bridge, fountain terrace and tree-lined mall. Two-way protected cycling tracks follow the park edges. People and cars fill the neighborhood, with basketball and pickleball players at Juniper Court.</desc>
